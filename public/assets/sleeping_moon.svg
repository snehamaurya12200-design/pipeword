
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
      <defs>
        <linearGradient id="moonGradS" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#fffbeb" />
          <stop offset="40%" stopColor="#fef08a" />
          <stop offset="100%" stopColor="#fcd34d" />
        </linearGradient>
        <filter id="softGlowM" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="blurCheekM" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" />
        </filter>
      </defs>

      <!-- Ambient Golden Moonlight Halo -->
      <circle cx="100" cy="100" r="75" fill="#fef08a" opacity="0.25" filter="url(#softGlowM)" />

      <!-- Floating Pastel Stars -->
      <g opacity="0.85">
        <polygon points="35,45 37,50 42,51 37,52 35,57 33,52 28,51 33,50" fill="#f472b6" />
        <polygon points="160,140 162,145 167,146 162,147 160,152 158,147 153,146 158,145" fill="#c084fc" />
        <circle cx="45" cy="150" r="3" fill="#fde047" />
        <circle cx="165" cy="50" r="3.5" fill="#fde047" />
      </g>

      <!-- Golden Crescent Moon -->
      <g filter="url(#softGlowM)">
        <path d="M 140 25 A 75 75 0 0 1 50 145 A 75 75 0 1 0 140 25 Z" fill="url(#moonGradS)" stroke="#f59e0b" stroke-width="2.5" />
      </g>

      <!-- Sleeping Eyelashes -->
      <path d="M 72 88 Q 82 98 92 88" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M 86 92 L 91 97" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 78 92 L 73 97" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />

      <!-- Sweet Sleeping Smile -->
      <path d="M 78 112 Q 86 122 94 114" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />

      <!-- Rosy Pink Blushing Cheek -->
      <circle cx="92" cy="102" r="10" fill="#f472b6" opacity="0.65" filter="url(#blurCheekM)" />

      <!-- Cute Cloud Pillow below Moon -->
      <g opacity="0.9" transform="translate(0, 15)">
        <circle cx="75" cy="155" r="22" fill="#ffffff" />
        <circle cx="105" cy="155" r="24" fill="#ffffff" />
        <circle cx="130" cy="158" r="18" fill="#ffffff" />
        <ellipse cx="100" cy="160" rx="45" ry="15" fill="#ffffff" />
      </g>
    </svg>
  